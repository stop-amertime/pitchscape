<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pitchscape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one riso "print sheet" (the canvas) on a grey-green print table, controls stacked under it.
   A deliberate single light theme: the piece is ink on paper, and multiply blending needs a light ground. */
:root {
  --table: #D9DCD3;
  --paper: #EEF0EA;
  --ink: #23211F;
  --muted: #565B52;
  --upcoming: #7D8278;
  --rule: #C3C7BC;
  --blue: #3255A4;
  --pink: #FF48B0;
  --purple: #765BA7;
  --teal: #00838A;
  --orange: #FF6C2F;
  --sun: #FFB511;
  --green: #00A95C;
  --crimson: #E45D50;
  --drum: #23211F;
  --on-blue: #F4F5F1;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { background: var(--table); color: var(--ink); }
body { font: 400 15px/1.5 var(--display); -webkit-font-smoothing: antialiased; }
.app {
  max-width: 980px; margin: 0 auto;
  padding-block: 14px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.title { position: relative; margin: 0; font: 800 clamp(28px, 7.4vw, 44px)/0.95 var(--display); font-variation-settings: "opsz" 96; letter-spacing: -0.035em; color: var(--blue); text-wrap: balance; }
.title::after { content: attr(data-text); position: absolute; inset: 0; transform: translate(2px, 1.6px); color: var(--pink); mix-blend-mode: multiply; pointer-events: none; }
.track { margin: 0; min-width: 0; font: 500 12px/1.3 var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.track b { font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* the print sheet */
.sheet { position: relative; background: var(--paper); border-radius: 3px; box-shadow: 0 1px 0 rgba(35, 33, 31, 0.08), 0 14px 32px -22px rgba(35, 45, 30, 0.55); overflow: hidden; }
.plate { position: relative; height: clamp(320px, 56svh, 660px); }
@supports not (height: 1svh) { .plate { height: clamp(320px, 56vh, 660px); } }
#cv { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; }
.status { position: absolute; left: 14px; right: 14px; bottom: 14px; background: rgba(238, 240, 234, 0.94); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; }
.status p { margin: 0; font: 600 14px/1.3 var(--display); }
.status .bar { height: 4px; margin-top: 9px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 0; background: var(--pink); transition: width 120ms linear; }
.tapzone { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(238, 240, 234, 0.95); border: 1.5px solid var(--teal); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
.tapzone .eyebrow { color: var(--teal); }
.tapzone .tap-line { margin: 0; font: 600 16px/1.3 var(--display); text-wrap: balance; }
.tapzone .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tapzone .count { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.caption { border-top: 1px dashed var(--rule); padding: 10px 14px 12px; display: grid; gap: 4px; min-height: 64px; }
.cap-now { margin: 0; font: 650 clamp(17px, 4.6vw, 21px)/1.3 var(--display); text-wrap: balance; color: var(--upcoming); min-width: 0; overflow-wrap: anywhere; }
.cap-now .on { color: var(--ink); }
.cap-now .cur { color: var(--teal); }
.cap-next { margin: 0; font: 400 12.5px/1.35 var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }

/* transport */
.transport { display: flex; align-items: center; gap: 14px; }
.play { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; cursor: pointer; }
.play:disabled { opacity: 0.35; cursor: default; }
.play svg { width: 22px; height: 22px; }
.scrub { flex: 1; min-width: 0; }
#seek { width: 100%; margin: 0; accent-color: var(--pink); height: 28px; }
.times { display: flex; justify-content: space-between; font: 500 11.5px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* buttons */
.actions, .lyr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 15px; font: 600 14px/1 var(--display); color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 4px; cursor: pointer; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn-quiet { border-color: transparent; color: var(--muted); padding: 0 8px; }
.btn-small { min-height: 34px; padding: 0 11px; font-size: 13px; }
.btn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.btn:focus-visible, .btn:focus-within, .play:focus-visible, .ink:focus-visible, summary:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.btn:has(input:focus-visible) { outline: 2px solid var(--pink); outline-offset: 2px; }
.file-btn { overflow: hidden; }
.file-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 100px; }
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.song { display: grid; gap: 2px; text-align: left; padding: 9px 12px; min-height: 52px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); cursor: pointer; font: inherit; }
.song b { font: 650 15px/1.2 var(--display); }
.song span { font: 400 11px/1.3 var(--mono); color: var(--muted); }
.song[aria-pressed="true"] { border: 1.5px solid var(--ink); box-shadow: inset 4px 0 0 var(--pink); }
.song:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.msg { margin: -4px 0 0; min-height: 1.4em; font: 400 13px/1.45 var(--display); color: var(--muted); }
.msg.err { color: #B3262E; }
.msg:empty { display: none; }

/* lyrics */
.lyrics { display: grid; gap: 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; }
#lyricsText { width: 100%; box-sizing: border-box; min-height: 9.5em; resize: vertical; font: 400 14px/1.5 var(--mono); color: var(--ink); background: #F7F8F4; border: 1px solid var(--rule); border-radius: 3px; padding: 10px; }
#lyricsText:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

/* inks */
.inks { display: block; }
.ink-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.ink { display: inline-flex; align-items: center; gap: 7px; padding: 0 12px 0 8px; min-height: 38px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); cursor: pointer; font: inherit; }
.ink svg { flex: none; width: 20px; height: 20px; color: var(--c); transform: scale(calc(0.8 + var(--lvl, 0) * 0.45)); transform-origin: 50% 50%; transition: transform 70ms linear; }
.ink .nm { font: 600 13.5px/1.15 var(--display); }
.ink[aria-pressed="false"] { background: transparent; border-style: dashed; }
.ink[aria-pressed="false"] svg { opacity: 0.3; }
.ink[aria-pressed="false"] .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }


.ink svg.drum { color: var(--drum); }

/* lab: A/B controls. While it is open the print stays pinned at the top so changes can be watched. */
.lab { display: grid; gap: 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px 14px; }
.lab-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 10px; }
.lab-row.slide { grid-template-columns: 74px minmax(0, 1fr) 44px; }
.lab-k { font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lab-v { font: 500 11px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.seg button { min-height: 32px; padding: 0 10px; font: 600 13px/1 var(--display); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 3px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg button:focus-visible, .lab input:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.lab input[type="password"] { min-width: 0; min-height: 34px; padding: 0 10px; font: 400 14px var(--mono); color: var(--ink); background: #F7F8F4; border: 1px solid var(--rule); border-radius: 3px; }
.lab input[type="range"] { width: 100%; margin: 0; height: 28px; accent-color: var(--pink); }
.lab-foot { display: flex; justify-content: flex-end; }
body.lab-open .sheet { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; box-shadow: 0 10px 24px -14px rgba(35, 45, 30, 0.6); }
body.lab-open .plate { height: clamp(240px, 44svh, 560px); }
@supports not (height: 1svh) { body.lab-open .plate { height: clamp(240px, 44vh, 560px); } }
#cv { transform-origin: 50% 100%; }

@media (prefers-reduced-motion: reduce) { .ink svg { transition: none; } }
</style>

</head>
<body>
<main class="app">
  <header class="mast">
    <h1 class="title" data-text="Pitchscape" aria-label="Pitchscape">Pitchscape</h1>
    <p class="track"><b id="trackName">Demo song</b></p>
  </header>

  <section class="sheet" aria-label="The print">
    <div class="plate" id="plate">
      <canvas id="cv" role="img" aria-label="A scrolling print of the song. Each kind of sound is drawn in its own ink; higher pitches sit higher on the sheet."></canvas>
      <div class="tapzone" id="tapzone" hidden>
        <div class="row"><span class="eyebrow">Tap the print as each line starts</span><span class="count" id="tapCount">0 / 0</span></div>
        <p class="tap-line" id="tapLine"></p>
        <div class="row">
          <button class="btn btn-small" id="tapUndo" type="button">Undo last tap</button>
          <button class="btn btn-small btn-primary" id="tapDone" type="button">Done</button>
        </div>
      </div>
      <div class="status" id="status" hidden>
        <p id="statusText">Getting ready</p>
        <div class="bar" role="progressbar" aria-labelledby="statusText" aria-valuemin="0" aria-valuemax="100"><i id="statusBar"></i></div>
      </div>
    </div>
    <div class="caption" id="caption" hidden>
      <p class="cap-now" id="capNow"></p>
      <p class="cap-next" id="capNext"></p>
    </div>
  </section>
  <div class="transport">
    <button class="play" id="play" type="button" aria-label="Play" disabled>
      <svg id="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>
    </button>
    <div class="scrub">
      <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Position in song">
      <div class="times"><span id="tNow">0:00</span><span id="tDur">0:00</span></div>
    </div>
  </div>

  <div class="shelf" role="group" aria-label="Songs on this page">
    <button class="song" type="button" data-song="demo" aria-pressed="false"><b>Demo song</b><span>Synth</span></button>
  </div>
  <div class="actions">
    <span class="btn btn-primary file-btn">Load a song<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.opus" aria-label="Load a song from your device"></span>
    <button class="btn" id="lyricsBtn" type="button" aria-expanded="false" aria-controls="lyricsPanel">Lyrics</button>
    <button class="btn" id="labBtn" type="button" aria-expanded="false" aria-controls="labPanel">Lab</button>
  </div>
  <p class="msg" id="msg" role="status"></p>

  <section class="lyrics" id="lyricsPanel" hidden>
    <textarea id="lyricsText" aria-label="Lyrics" spellcheck="false" placeholder="Paste lyrics"></textarea>
    <div class="lyr-actions">
      <button class="btn btn-primary" id="placeBtn" type="button">Place</button>
      <button class="btn" id="tapBtn" type="button">Tap along</button>
      <span class="btn file-btn">Timing file<input type="file" id="lrcFile" accept=".lrc,.json,.txt,text/plain,application/json" aria-label="Load a timing file"></span>
      <button class="btn btn-quiet" id="clearLyr" type="button">Clear</button>
    </div>
  </section>

  <section class="lab" id="labPanel" aria-label="Lab" hidden>
    <div class="lab-row"><span class="lab-k" id="lk-colour">Colour</span><div class="seg" data-key="colour" role="group" aria-labelledby="lk-colour"><button type="button" id="lab-colour-inst" data-v="inst">By instrument</button><button type="button" id="lab-colour-height" data-v="height">By height</button><button type="button" id="lab-colour-note" data-v="note">By note</button></div></div>
    <div class="lab-row"><span class="lab-k" id="lk-drumInk">Drum ink</span><div class="seg" data-key="drumInk" role="group" aria-labelledby="lk-drumInk"><button type="button" id="lab-drumInk-black" data-v="black">Black</button><button type="button" id="lab-drumInk-pink" data-v="pink">Pink</button><button type="button" id="lab-drumInk-purple" data-v="purple">Purple</button></div></div>
    <div class="lab-row"><span class="lab-k" id="lk-drums">Drums</span><div class="seg" data-key="drums" role="group" aria-labelledby="lk-drums"><button type="button" id="lab-drums-sound" data-v="sound">From the sound</button><button type="button" id="lab-drums-simple" data-v="simple">Fixed shapes</button></div></div>
    <div class="lab-row"><span class="lab-k" id="lk-kick">Kick</span><div class="seg" data-key="kick" role="group" aria-labelledby="lk-kick"><button type="button" id="lab-kick-halftone" data-v="halftone">Halftone</button><button type="button" id="lab-kick-smudge" data-v="smudge">Smudge</button><button type="button" id="lab-kick-ring" data-v="ring">Ring</button></div></div>
    <div class="lab-row"><span class="lab-k" id="lk-font">Words</span><div class="seg" data-key="font" role="group" aria-labelledby="lk-font"><button type="button" id="lab-font-grotesque" data-v="grotesque">Grotesque</button><button type="button" id="lab-font-script" data-v="script">Script</button><button type="button" id="lab-font-serif" data-v="serif">Serif</button><button type="button" id="lab-font-mono" data-v="mono">Mono</button></div></div>
    <div class="lab-row"><span class="lab-k" id="lk-wordSize">Word size</span><div class="seg" data-key="wordSize" role="group" aria-labelledby="lk-wordSize"><button type="button" id="lab-wordSize-voice" data-v="voice">Follows voice</button><button type="button" id="lab-wordSize-fixed" data-v="fixed">Fixed</button></div></div>
    <label class="lab-row slide"><span class="lab-k">Shake</span><input type="range" id="lab-shake" data-key="shake" min="0" max="1" step="0.05"><span class="lab-v" id="lab-shake-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Tilt</span><input type="range" id="lab-tilt" data-key="tilt" min="0" max="1" step="0.05"><span class="lab-v" id="lab-tilt-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Thud glow</span><input type="range" id="lab-pulse" data-key="pulse" min="0" max="1" step="0.05"><span class="lab-v" id="lab-pulse-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Slip</span><input type="range" id="lab-slip" data-key="slip" min="0" max="1" step="0.05"><span class="lab-v" id="lab-slip-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Seconds</span><input type="range" id="lab-secs" data-key="secs" min="2" max="10" step="0.5"><span class="lab-v" id="lab-secs-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Ink</span><input type="range" id="lab-ink" data-key="ink" min="0.4" max="1.6" step="0.05"><span class="lab-v" id="lab-ink-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Weight</span><input type="range" id="lab-weight" data-key="weight" min="0.5" max="1.8" step="0.05"><span class="lab-v" id="lab-weight-v"></span></label>
    <label class="lab-row slide"><span class="lab-k">Grain</span><input type="range" id="lab-grain" data-key="grain" min="0" max="1" step="0.05"><span class="lab-v" id="lab-grain-v"></span></label>
    <label class="lab-row"><span class="lab-k">Server key</span><input type="password" id="lab-key" autocomplete="off" spellcheck="false" placeholder="passphrase"></label>
    <div class="lab-foot"><button class="btn btn-small btn-quiet" id="labReset" type="button">Reset</button></div>
  </section>

  <section class="inks" aria-label="Inks: tap one to lift it off the print">
    <div class="ink-grid">
      <button class="ink" type="button" data-layer="bass" aria-pressed="true" style="--c: var(--blue)">
        <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M2 15c3-5 5-5 8 0s5 5 8 0 4-5 6-2v5c-2-3-3-3-6 2s-5 5-8 0-5-5-8 0z" fill="currentColor"/></svg>
        <span class="nm">Bass</span></button>
      <button class="ink" type="button" data-layer="kick" aria-pressed="true" style="--c: var(--drum)">
        <svg class="drum" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13.0" cy="13.0" r="3.2" fill="currentColor"/><circle cx="17.2" cy="14.8" r="2.2" fill="currentColor"/><circle cx="14.2" cy="17.4" r="2.2" fill="currentColor"/><circle cx="10.3" cy="16.7" r="2.2" fill="currentColor"/><circle cx="8.4" cy="13.2" r="2.2" fill="currentColor"/><circle cx="10.0" cy="9.5" r="2.2" fill="currentColor"/><circle cx="13.8" cy="8.5" r="2.2" fill="currentColor"/><circle cx="17.0" cy="10.8" r="2.2" fill="currentColor"/><circle cx="18.9" cy="19.0" r="1.3" fill="currentColor"/><circle cx="15.1" cy="21.1" r="1.3" fill="currentColor"/><circle cx="10.7" cy="21.1" r="1.3" fill="currentColor"/><circle cx="7.0" cy="18.9" r="1.3" fill="currentColor"/><circle cx="4.9" cy="15.1" r="1.3" fill="currentColor"/><circle cx="4.9" cy="10.7" r="1.3" fill="currentColor"/><circle cx="7.1" cy="7.0" r="1.3" fill="currentColor"/><circle cx="10.9" cy="4.9" r="1.3" fill="currentColor"/><circle cx="15.3" cy="4.9" r="1.3" fill="currentColor"/><circle cx="19.0" cy="7.1" r="1.3" fill="currentColor"/><circle cx="21.1" cy="10.9" r="1.3" fill="currentColor"/><circle cx="21.1" cy="15.3" r="1.3" fill="currentColor"/><circle cx="17.1" cy="23.6" r="0.7" fill="currentColor"/><circle cx="12.8" cy="24.4" r="0.7" fill="currentColor"/><circle cx="8.4" cy="23.4" r="0.7" fill="currentColor"/><circle cx="4.8" cy="20.9" r="0.7" fill="currentColor"/><circle cx="2.4" cy="17.1" r="0.7" fill="currentColor"/><circle cx="1.6" cy="12.8" r="0.7" fill="currentColor"/><circle cx="2.6" cy="8.4" r="0.7" fill="currentColor"/><circle cx="5.1" cy="4.8" r="0.7" fill="currentColor"/><circle cx="8.9" cy="2.4" r="0.7" fill="currentColor"/><circle cx="13.2" cy="1.6" r="0.7" fill="currentColor"/><circle cx="17.6" cy="2.6" r="0.7" fill="currentColor"/><circle cx="21.2" cy="5.1" r="0.7" fill="currentColor"/><circle cx="23.6" cy="8.9" r="0.7" fill="currentColor"/><circle cx="24.4" cy="13.2" r="0.7" fill="currentColor"/><circle cx="23.4" cy="17.6" r="0.7" fill="currentColor"/><circle cx="20.9" cy="21.2" r="0.7" fill="currentColor"/></svg>
        <span class="nm">Kick</span></button>
      <button class="ink" type="button" data-layer="snare" aria-pressed="true" style="--c: var(--drum)">
        <svg class="drum" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 7.5l2 3.6 3.9-1-1.6 3.7 3 2.6-4 .6-.4 4-2.9-2.8-3.2 2.4.1-4.1-3.9-1.1 3.4-2.2-1.2-3.9 3.8 1.5z" fill="currentColor"/><circle cx="4" cy="6" r="1.3" fill="currentColor"/><circle cx="22.5" cy="5" r="1" fill="currentColor"/><circle cx="21.5" cy="21.5" r="1.4" fill="currentColor"/><circle cx="5" cy="21" r="0.9" fill="currentColor"/></svg>

      return Array.prototype.map.call(new Uint8Array(d), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
    }, function () { return null; });
  }
  function loadFile(file) {
    var my = beginLoad('Opening ' + file.name, ''), name = file.name.replace(/\.[^.]+$/, ''), sha = null;
    $('trackName').textContent = file.name;
    file.arrayBuffer().then(function (buf) {
      return sha256hex(buf).then(function (h) {
        sha = h;
        return findPack(h);
      }).then(function (pack) {
        if (my !== loadSeq) return;
        if (pack) {
          setAudioSrc(URL.createObjectURL(file));
          finishLoad(packToRes(pack), name, 'sha:' + sha, null, 0);
          useServerLyrics(pack);
          return 'known';
        }
        showStatus('Decoding the audio', 0.02);
        return decode(buf).then(function (ab) {
          if (my !== loadSeq) return;
          if (ab.duration > 15 * 60) { fail('That track is over 15 minutes. Try something shorter.'); return; }
          var L = new Float32Array(ab.getChannelData(0)), R = ab.numberOfChannels > 1 ? new Float32Array(ab.getChannelData(1)) : null;
          setAudioSrc(URL.createObjectURL(file));
          return runJob({ cmd: 'analyze', L: L, R: R, sr: ab.sampleRate }, R ? [L.buffer, R.buffer] : [L.buffer], showStatus).then(function (r) {
            if (my !== loadSeq) return;
            finishLoad(r.res, name, sha ? 'sha:' + sha : file.name + '|' + Math.round(ab.duration), null, 0);
          });
        });
      });
    }).then(function (how) {
      if (how !== 'known' && my === loadSeq && S.ana) fullAnalysis(file, sha, my);
    }, function () {
      if (my === loadSeq) fail("Couldn't read that file. Try MP3, M4A, WAV or OGG.");
    });
  }

  /* ------------------------------------------------------------ the analysis server
     The quick analysis above runs on the phone; the full one (stems, drum transcription, notes, words) runs on the
     server named in config.json. Its result replaces the quick one in place, and is kept on the device. */
  var API = null, PIPELINE = '', apiReady = Promise.resolve(null);
  try {
    apiReady = fetch('config.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) {
      API = c && c.api ? String(c.api).replace(/\/$/, '') : null; PIPELINE = c && c.pipeline ? String(c.pipeline) : ''; return API;
    }, function () { return null; });
  } catch (e) { /* no config */ }
  /* where a song's full analysis is kept on the device: a new version of the server's analysis starts afresh */
  function packKey(sha) { return 'pack:' + PIPELINE + ':' + sha; }
  var idb = (function () {
    var dbp = null;
    function open() {
      if (!dbp) dbp = new Promise(function (res, rej) {
        try { var r = indexedDB.open('pitchscape', 1); r.onupgradeneeded = function () { r.result.createObjectStore('packs'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }
        catch (e) { rej(e); }
      });
      return dbp;
    }
    function run(mode, fn) {
      return open().then(function (db) {
        return new Promise(function (res, rej) { var t = db.transaction('packs', mode), q = fn(t.objectStore('packs')); t.oncomplete = function () { res(q && q.result); }; t.onerror = function () { rej(t.error); }; });
      });
    }
    return {
      get: function (k) { return run('readonly', function (st) { return st.get(k); }).catch(function () { return null; }); },
      put: function (k, v) { return run('readwrite', function (st) { return st.put(v, k); }).catch(function () {}); }
    };
  })();
  var STAGES = [['stems', 'splitting the song into stems'], ['drums', 'reading the drums'], ['notes', 'reading the notes'], ['bass', 'following the bass'],
    ['voice', 'following the voice'], ['words', 'listening for the words'], ['done', 'finishing']];
  function stageText(st) { for (var i = 0; st && i < STAGES.length; i++) if (st.indexOf(STAGES[i][0]) === 0) return STAGES[i][1]; return 'starting the server'; }
  /* the full analysis of a song, if it exists: on this device first, then on the server */
  function findPack(sha) {
    if (!sha) return Promise.resolve(null);
    return apiReady.then(function () {
      if (!API) return null;
      return idb.get(packKey(sha)).then(function (p) {
        if (p) return p;
        var key = store.get('pitchscape:key');
        if (!key) return null;
        // a server that is slow to answer must not hold up a new song; once it answers, the download is not cut off
        var ctl = window.AbortController ? new AbortController() : null, timer = ctl && setTimeout(function () { ctl.abort(); }, 4000);
        return fetch(API + '/packs/' + sha, { headers: { 'X-Pitchscape-Key': key }, signal: ctl ? ctl.signal : undefined }).then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; }).then(function (j) {
          if (j && j.pack) { idb.put(packKey(sha), j.pack); return j.pack; }
          return null;
        }, function () { return null; });
      });
    });
  }
  function fullAnalysis(file, sha, my) {
    apiReady.then(function () { if (my === loadSeq) upload(file, sha, my); });
  }
  function upload(file, sha, my) {
    if (!API) return;
    var key = store.get('pitchscape:key'), keep = function (pack) { if (sha) idb.put(packKey(sha), pack); };
    if (!key) { say('Add the server key in the Lab for the full analysis.'); return; }
    Promise.resolve().then(function () {
      if (my !== loadSeq) return;
      say('Full analysis: uploading');
      var fd = new FormData(); fd.append('file', file, file.name);
      return fetch(API + '/analyze', { method: 'POST', headers: { 'X-Pitchscape-Key': key }, body: fd }).then(function (r) {
        if (r.status === 401) throw new Error('The server key is wrong. Check it in the Lab.');
        if (!r.ok) throw new Error('The server said ' + r.status + '.');
        return r.json();
      }).then(function (j) {
        if (j.status === 'done') { keep(j.pack); applyServerPack(j.pack, my); return; }
        var poll = function () {
          if (my !== loadSeq) return;
          fetch(API + '/jobs/' + encodeURIComponent(j.job) + '?key=' + encodeURIComponent(j.key), { headers: { 'X-Pitchscape-Key': key } }).then(function (r) { return r.json(); }).then(function (p) {
            if (my !== loadSeq) return;
            if (p.status === 'done' && p.pack) { keep(p.pack); applyServerPack(p.pack, my); }
            else if (p.status === 'failed') say('Full analysis failed: ' + (p.error || 'unknown error'), true);
            else { say('Full analysis: ' + stageText(p.stage)); setTimeout(poll, 3000); }
          }, function () { setTimeout(poll, 6000); });
        };
        say('Full analysis: starting the server'); setTimeout(poll, 2500);
      });
    }).catch(function (e) { if (my === loadSeq) say((e && e.message) || "Couldn't reach the server.", true); });
  }
  function packToRes(pack) {
    var res = { dur: pack.dur, dt: pack.dt, frames: pack.frames, stereo: pack.stereo, noiseRef: pack.noiseRef };
    for (var k in pack.arrays) res[k] = b64f32(pack.arrays[k]);
    res.segW = pack.segStride || 6; res.evW = pack.eventStride || 4;
    return res;
  }
  function applyServerPack(pack, my) {
    if (my !== loadSeq) return;
    setAnalysis(packToRes(pack)); S.dirty = true;
    useServerLyrics(pack);
    say('Full analysis loaded.');
  }
  /* words the server heard, unless lyrics were already placed for this song on this device */
  function useServerLyrics(pack) {
    if (pack.lyrics && pack.lyrics.lines && pack.lyrics.lines.length && !store.get(lyricKey())) {
      var lines = pack.lyrics.lines.map(function (l) { return { text: l.text, words: l.words.map(function (w) { return { text: w[0], syl: Math.max(1, DSP.syllableCount(w[0])) }; }) }; });
      lyricsText.value = lines.map(function (l) { return l.text; }).join('\n');
      applyWordTimes(lines, pack.lyrics.lines.map(function (l) { return l.words.map(function (w) { return w[1]; }); }), 'heard');
    } else layoutWords();
  }
  /* songs analysed ahead of time and published with the page: stems + word timing, no lyrics */
  var SONGS = {};
  function b64f32(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Float32Array(u.buffer); }
  function loadPack(id) {
    var song = SONGS[id], btn = document.querySelector('.song[data-song="' + id + '"]'), title = btn ? btn.querySelector('b').textContent : id;
    var my = beginLoad('Loading ' + title, id);
    $('trackName').textContent = title;
    return fetch(song.pack).then(function (r) { if (!r.ok) throw new Error('song data ' + r.status); return r.json(); }).then(function (pack) {
      showStatus('Loading the audio', 0.5);
      return fetch(pack.audio).then(function (r) { if (!r.ok) throw new Error('audio ' + r.status); return r.blob(); }).then(function (blob) {
        if (my !== loadSeq) return;
        setAudioSrc(URL.createObjectURL(blob));
        var res = packToRes(pack);
        S.timing = pack.timing;
        finishLoad(res, pack.title + ' · ' + pack.artist, 'pack:' + id, null, song.preview);
      });
    }).catch(function (e) { if (my === loadSeq) { fail("Couldn't load the built-in song (" + e.message + ')'); } throw e; });
  }
  document.querySelectorAll('.song').forEach(function (b) {
    b.addEventListener('click', function () { if (b.dataset.song === 'demo') loadDemo(); else loadPack(b.dataset.song).catch(function () {}); });
  });
  /* if tapping Load opens nothing (some in-app viewers block file pickers), say so instead of failing silently */
  var fileInput = $('file'), pickTimer = null, pickLeft = false;
  fileInput.addEventListener('click', function () {
    pickLeft = false; clearTimeout(pickTimer);
    pickTimer = setTimeout(function () { if (!pickLeft) say("No file picker? Open this page in your browser to load songs.", true); }, 2500);
  });
  window.addEventListener('blur', function () { pickLeft = true; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pickLeft = true; });
  fileInput.addEventListener('change', function () { clearTimeout(pickTimer); var f = this.files && this.files[0]; this.value = ''; if (f) loadFile(f); });

  /* ink toggles */
  document.querySelectorAll('.ink').forEach(function (b) {
    b.addEventListener('click', function () {
      var l = b.dataset.layer; S.vis[l] = !S.vis[l]; b.setAttribute('aria-pressed', String(S.vis[l])); if (l === 'words') capKey = '';
      S.dirty = true;
    });
  });

  /* lab */
  var labPanel = $('labPanel');
  function labVal(k, v) { return k === 'secs' ? v.toFixed(1) + ' s' : k === 'ink' || k === 'weight' ? '×' + v.toFixed(2) : Math.round(v * 100) + '%'; }
  function labUI() {
    labPanel.querySelectorAll('.seg').forEach(function (g) {
      var k = g.dataset.key;
      g.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(String(L[k]) === b.dataset.v)); });
    });
    labPanel.querySelectorAll('input[type="range"]').forEach(function (r) {
      var k = r.dataset.key, v = k === 'secs' ? (L.secs > 0 ? L.secs : WIN) : L[k];
      r.value = String(v); $('lab-' + k + '-v').textContent = labVal(k, v);
    });
    document.documentElement.style.setProperty('--drum', drumHex());
  }
  function labApply(k) {
    saveLab();
    if (k === 'secs' || k === 'all') resize();
    if (k === 'font' || k === 'wordSize' || k === 'weight' || k === 'all') ensureFont(L.font).then(function () { layoutWords(); S.dirty = true; });
    labUI(); S.dirty = true;
  }
  labPanel.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { var k = b.parentNode.dataset.key; L[k] = b.dataset.v; labApply(k); });
  });
  labPanel.querySelectorAll('input[type="range"]').forEach(function (r) {
    r.addEventListener('input', function () { var k = r.dataset.key; L[k] = parseFloat(r.value); labApply(k); });
  });
  $('labReset').addEventListener('click', function () { L = Object.assign({}, LAB_DEF); labApply('all'); });
  $('labBtn').addEventListener('click', function () {
    var open = labPanel.hidden; labPanel.hidden = !open; this.setAttribute('aria-expanded', String(open));
    document.body.classList.toggle('lab-open', open);
  });
  labUI();
  var keyIn = $('lab-key');
  keyIn.value = store.get('pitchscape:key') || '';
  keyIn.addEventListener('change', function () { var v = keyIn.value.trim(); if (v) store.set('pitchscape:key', v); else store.del('pitchscape:key'); say(v ? 'Server key saved. Load a song for the full analysis.' : 'Server key removed.'); });
  if (L.font !== 'grotesque') ensureFont(L.font).then(function () { layoutWords(); S.dirty = true; });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layoutWords(); S.dirty = true; });
  requestAnimationFrame(loop);
  var firstSong = Object.keys(SONGS)[0];
  (firstSong ? loadPack(firstSong) : Promise.reject(new Error('no songs'))).catch(function () { loadDemo(); });
})();
</script>
</body>
</html>
